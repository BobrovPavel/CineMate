services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cinemate
      POSTGRES_DB: cinemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemate -d cinemate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://cinemate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cinemate
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
